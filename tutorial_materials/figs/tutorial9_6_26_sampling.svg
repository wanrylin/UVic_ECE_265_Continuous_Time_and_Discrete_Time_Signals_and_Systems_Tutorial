  <path d="M 931 428 v 5" class="axis" /><text x="931" y="450" class="tick" text-anchor="middle">4</text>
  <path d="M 972 428 v 5" class="axis" /><text x="972" y="450" class="tick" text-anchor="middle">5</text>
  <text x="553" y="353" class="tick" text-anchor="end">1</text>
  <text x="553" y="433" class="tick" text-anchor="end">0</text>
  <text x="972" y="471" class="axislabel" text-anchor="end">v = ω / (1000π)</text>
  <path d="M 562 428 H 726 M 726 348 H 808 M 808 428 H 972" fill="none" stroke="#0e7768" stroke-width="3.6" stroke-linejoin="round" />
  <circle cx="726" cy="428" r="4.6" fill="#fff" stroke="#0e7768" stroke-width="2" />
  <circle cx="726" cy="348" r="4.6" fill="#0e7768" stroke="#0e7768" stroke-width="2" />
