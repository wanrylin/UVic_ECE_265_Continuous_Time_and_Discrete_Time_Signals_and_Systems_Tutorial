  <path d="M 767 428 v 5" class="axis" /><text x="767" y="450" class="tick" text-anchor="middle">0</text>
  <path d="M 808 428 v 5" class="axis" /><text x="808" y="450" class="tick" text-anchor="middle">1</text>
  <path d="M 849 428 v 5" class="axis" /><text x="849" y="450" class="tick" text-anchor="middle">2</text>
