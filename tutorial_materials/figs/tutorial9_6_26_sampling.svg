  <path d="M 438 428 v 5" class="axis" /><text x="438" y="450" class="tick" text-anchor="middle">4</text>
  <path d="M 479 428 v 5" class="axis" /><text x="479" y="450" class="tick" text-anchor="middle">5</text>
  <text x="60" y="353" class="tick" text-anchor="end">1</text>
  <text x="60" y="433" class="tick" text-anchor="end">0</text>
  <text x="479" y="471" class="axislabel" text-anchor="end">v = ω / (1000π)</text>
  <path d="M 69 348 H 479" fill="none" stroke="#235db8" stroke-width="3.6" stroke-linejoin="round" />
  </g>
  <g>
  <text x="525" y="289" class="title">(c) Reconstructed spectrum Y</text>
  <text x="525" y="311" class="subtitle">A rectangle, not the original triangle</text>
  <path d="M 562 348 H 972" class="guide" />
  <path d="M 562 428 H 972 M 767 431 V 335" class="axis" />
  <path d="M 562 428 v 5" class="axis" /><text x="562" y="450" class="tick" text-anchor="middle">−5</text>
