  <path d="M 972 186 v 5" class="axis" /><text x="972" y="208" class="tick" text-anchor="middle">5</text>
  <text x="553" y="111" class="tick" text-anchor="end">1</text>
  <text x="553" y="191" class="tick" text-anchor="end">0</text>
  <text x="972" y="229" class="axislabel" text-anchor="end">v = ω / (1000π)</text>
  <path d="M 562 186 H 726 L 767 106 L 808 186 H 972" fill="none" stroke="#0e7768" stroke-width="3.6" stroke-linejoin="round" />
  </g>
  <g>
  <text x="32" y="289" class="title">(c) Sampled spectrum S / 1000</text>
  <text x="32" y="311" class="subtitle">Wide overlapping copies add to one</text>
  <path d="M 69 348 H 479" class="guide" />
  <path d="M 69 428 H 479 M 274 431 V 335" class="axis" />
  <path d="M 69 428 v 5" class="axis" /><text x="69" y="450" class="tick" text-anchor="middle">−5</text>
  <path d="M 110 428 v 5" class="axis" /><text x="110" y="450" class="tick" text-anchor="middle">−4</text>
  <path d="M 151 428 v 5" class="axis" /><text x="151" y="450" class="tick" text-anchor="middle">−3</text>
  <path d="M 192 428 v 5" class="axis" /><text x="192" y="450" class="tick" text-anchor="middle">−2</text>
  <path d="M 233 428 v 5" class="axis" /><text x="233" y="450" class="tick" text-anchor="middle">−1</text>
  <path d="M 274 428 v 5" class="axis" /><text x="274" y="450" class="tick" text-anchor="middle">0</text>
  <path d="M 315 428 v 5" class="axis" /><text x="315" y="450" class="tick" text-anchor="middle">1</text>
  <path d="M 356 428 v 5" class="axis" /><text x="356" y="450" class="tick" text-anchor="middle">2</text>
