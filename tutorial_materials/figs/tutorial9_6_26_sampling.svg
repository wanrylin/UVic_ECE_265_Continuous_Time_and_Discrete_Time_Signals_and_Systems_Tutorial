  <path d="M 726 186 v 5" class="axis" /><text x="726" y="208" class="tick" text-anchor="middle">−1</text>
  <path d="M 767 186 v 5" class="axis" /><text x="767" y="208" class="tick" text-anchor="middle">0</text>
  <path d="M 808 186 v 5" class="axis" /><text x="808" y="208" class="tick" text-anchor="middle">1</text>
